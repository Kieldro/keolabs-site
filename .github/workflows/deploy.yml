name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Fired by keolabs-voice-agent's notify-site workflow whenever a YAML under
  # clients/** changes on its main branch. The dispatch wakes this build so the
  # site re-renders with the new tab without a manual demos.json sync.
  repository_dispatch:
    types: [clients-changed]
  # Weekly safety net: if the cross-repo dispatch ever fails (PAT expired,
  # GitHub outage), this catches up at most 7 days later.
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pull voice-agent into ./voice-agent so loadDemoProfiles() in
      # src/pages/index.astro reads live client YAMLs instead of the
      # checked-in fallback manifest. voice-agent is PRIVATE, so this
      # needs a fine-grained PAT with Contents:read on the repo, stored
      # as the VOICE_AGENT_READ_TOKEN secret. If absent, the build still
      # succeeds via demos.json fallback (continue-on-error).
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: Kieldro/keolabs-voice-agent
          path: voice-agent
          ref: main
          token: ${{ secrets.VOICE_AGENT_READ_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Notify ntfy.sh on success
        if: success()
        run: |
          curl -s \
            -H "Title: keolabs.ai deployed" \
            -H "Tags: rocket,white_check_mark" \
            -H "Click: ${{ steps.deployment.outputs.page_url }}" \
            -d "${{ github.event.head_commit.message || github.event.action || 'scheduled rebuild' }}" \
            https://ntfy.sh/keolabs-deploys-7ea5b2a08245
